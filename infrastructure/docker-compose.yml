##############################################################################
# ArkhitX Infrastructure — Shared Services
#
# Start this FIRST before running any project that uses Phase 3 governance.
#
#   cd infrastructure
#   docker-compose up -d
#
# This runs:
#   • PostgreSQL   → stores governance data (audit logs, prompts, grounding)
#   • Neo4j        → stores knowledge graph data (domain entities, relationships)
#   • ArkhitX API  → governance REST API  (http://localhost:8080)
#   • ArkhitX UI   → governance dashboard (http://localhost:8090)
#
# All services are on the shared "arkhitx-network" so project containers
# can connect to them by service name (e.g. host=postgres, host=neo4j).
##############################################################################

networks:
  arkhitx-network:
    name: arkhitx-network
    driver: bridge

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [arkhitx-network]
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: arkhitx
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d arkhitx"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5
    restart: unless-stopped
    networks: [arkhitx-network]
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null -q http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  arkhitx-backend:
    build:
      context: ../framework/backend
    restart: unless-stopped
    networks: [arkhitx-network]
    ports:
      - "8080:8000"
    environment:
      DATABASE_URL: postgresql://user:password@postgres:5432/arkhitx
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      # SDK uses ARKHITX_* prefixed names
      ARKHITX_DATABASE_URL: postgresql://user:password@postgres:5432/arkhitx
      ARKHITX_NEO4J_URI: bolt://neo4j:7687
      ARKHITX_NEO4J_USER: neo4j
      ARKHITX_NEO4J_PASSWORD: password
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    volumes:
      - ../framework/backend:/app
      - ../framework/sdk:/sdk
      - ../projects:/workspace/projects:rw
      - ../projects.json:/workspace/projects.json:rw
      - ../framework/ontology:/workspace/framework/ontology:ro
      - ../framework/governance:/workspace/framework/governance:ro

  arkhitx-frontend:
    build:
      context: ../framework/frontend
    restart: unless-stopped
    networks: [arkhitx-network]
    ports:
      - "8090:3000"
    depends_on:
      - arkhitx-backend
    environment:
      VITE_API_TARGET: http://arkhitx-backend:8000
    volumes:
      - ../framework/frontend:/app
      - /app/node_modules

volumes:
  pgdata:
  neo4jdata:

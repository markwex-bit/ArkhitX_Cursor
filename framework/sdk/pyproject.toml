[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arkhitx-sdk"
version = "0.1.0"
description = "Governance and grounding SDK for ArkhitX-managed projects"
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "neo4j>=5.0",
    "anthropic>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["arkhitx*"]

##############################################################################
# ArkhitX — root docker-compose.yml
#
# PREFERRED: use infrastructure/docker-compose.yml instead.
# This file is kept for backward compatibility.
##############################################################################

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: arkhitx
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata:/data

  backend:
    build: ./framework/backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://user:password@postgres:5432/arkhitx
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    depends_on:
      - postgres
      - neo4j
    volumes:
      - ./framework/backend:/app
      - ./framework/sdk:/sdk
      - upload_data:/app/data

  frontend:
    build: ./framework/frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./framework/frontend:/app
      - /app/node_modules
    environment:
      VITE_API_TARGET: http://backend:8000

volumes:
  pgdata:
  neo4jdata:
  upload_data:
